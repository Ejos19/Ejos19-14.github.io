<!doctype html>
<html lang="es">
  <head>
    <link href="Asset/icono oso2.png" rel="icon" sizes="200x200" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM OSONIKI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top-bar">
      <div class="window-controls">
        <div id="logo">
          <img
            src="Asset/Osiniki4k.png"
            alt="LogoPersonalizado"
            width="110"
            height="45"
          />
        </div>
      </div>
      <div class="title-bar">
        CRM for Sheet — <span class="highlight">OSONIKI</span>
      </div>
      <div id="logo">
        <img
          src="Asset/Union4.png"
          alt="LogoPersonalizado"
          width="115"
          height="115"
        />
      </div>
    </div>

    <div class="main-content">
      <div class="icon-display" id="main-display"></div>
      <h1 id="main-title">Home</h1>
      <p class="subtitle" id="main-subtitle">Everything, on one surface.</p>

      <div class="dock-container" id="dock">
        <svg class="dock-bg" viewBox="0 0 400 70">
          <path id="dock-path" d="" />
        </svg>
        <div class="bead" id="bead"></div>

        <div class="tabs" id="tabs-container">
          <button
            class="tab active"
            data-color="#33b2ff"
            data-title="Registro Deportivo"
            data-subtitle="Equipos, Jugadores y Cuerpo Técnico"
          >
            <a href="Afiliados/index.html">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-users-round-icon lucide-users-round"
              >
                <path d="M18 21a8 8 0 0 0-16 0" />
                <circle cx="10" cy="8" r="5" />
                <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" />
              </svg>
            </a>
          </button>
          <button
            class="tab"
            data-color="#ff6300"
            data-title="Game Play"
            data-subtitle="Calendario de Juegos"
          >
            <a href="Game Play/Game.html">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-gamepad2-icon lucide-gamepad-2"
              >
                <line x1="6" x2="10" y1="11" y2="11" />
                <line x1="8" x2="8" y1="9" y2="13" />
                <line x1="15" x2="15.01" y1="12" y2="12" />
                <line x1="18" x2="18.01" y1="10" y2="10" />
                <path
                  d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"
                />
              </svg>
            </a>
          </button>
          <button
            class="tab"
            data-color="#ff003c"
            data-title="Game History"
            data-subtitle="Historial de juegos y partidos."
          >
            <a href="History Game/HistoryGame.html">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-list-clock-icon lucide-list-clock"
              >
                <path d="M16 13v2.2l1.6 1" />
                <path d="M3 12h3.458" />
                <path d="M3 19h3.832" />
                <path d="M3 5h18" />
                <circle cx="16" cy="15" r="6" />
              </svg>
            </a>
          </button>
          <button
            class="tab"
            data-color="#a855f7"
            data-title="Tabla de Posiciones"
            data-subtitle="Tabla de posiciones y Eliminatorias de la liga."
          >
            <a href="Position Table/PositionTable.html">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="60"
                height="60"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-trophy-icon lucide-trophy"
              >
                <path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2" />
                <path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2" />
                <path
                  d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3"
                />
                <path d="M4 22h16" />
                <path
                  d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"
                />
                <path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3" />
              </svg>
            </a>
          </button>
          <button
            class="tab"
            data-color="#575757"
            data-title="Time Clock Control"
            data-subtitle="Agrega pedidos para generar N° Factura."
          >
            <a href="Reloj/Reloj.html">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-clock-fading-icon lucide-clock-fading"
              >
                <path d="M12 2a10 10 0 0 1 7.38 16.75" />
                <path d="M12 6v6l4 2" />
                <path d="M2.5 8.875a10 10 0 0 0-.5 3" />
                <path d="M2.83 16a10 10 0 0 0 2.43 3.4" />
                <path d="M4.636 5.235a10 10 0 0 1 .891-.857" />
                <path d="M8.644 21.42a10 10 0 0 0 7.631-.38" />
              </svg>
            </a>
          </button>
        </div>
      </div>

      <p class="instruction">
        Registra todos los movimientos deportivos de manera facil y rapida.
      </p>
      <br />
      <div id="logo">
        <img
          src="Asset/icono oso2.png"
          alt="LogoPersonalizado"
          width="40"
          height="40"
        />
      </div>
    </div>

    <script src="app.js"></script>
        !-- Script del sistema de seguridad / bloqueo de enlaces -->
    <script src="Seguridad/auth-guard.js"></script>
  </body>
</html>
